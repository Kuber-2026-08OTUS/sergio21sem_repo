apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-deployment
  namespace: homework
  labels:
    app: busybox
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      initContainers:
        - name: init-container
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              wget -O /init/index.html https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
          volumeMounts:
            - name: homework-volume
              mountPath: /init

      containers:
        - name: web
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              httpd -f -p 8000 -h /homework
          ports:
            - containerPort: 8000

          volumeMounts:
            - name: homework-volume
              mountPath: /homework

          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /homework/index.html
            initialDelaySeconds: 5
            periodSeconds: 5

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - rm -f /homework/index.html

      volumes:
        - name: homework-volume
          emptyDir: {}