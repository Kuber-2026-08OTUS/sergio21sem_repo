{{- if .Values.httpRoute.enabled }}
#https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/gateway-api/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "helm-hw.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helm-hw.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listenerName }}
      kind: Gateway

  hostnames:
    - {{ .Values.httpRoute.hostname }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "helm-hw.fullname" . }}
          namespace: {{ .Values.namespace }}
          port: {{ .Values.service.port }}
{{- end }}
