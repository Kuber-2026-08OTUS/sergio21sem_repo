apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm-hw.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helm-hw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "helm-hw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helm-hw.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: {{ .Values.initContainer.name }}
          image: "{{ .Values.initContainer.image.repository }}:{{ .Values.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.initContainer.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              wget -O /init/index.html {{ .Values.initContainer.indexUrl }}
          volumeMounts:
            - name: homework-volume
              mountPath: /init

      containers:
        - name: {{ .Values.container.name }}
          image: "{{ .Values.container.image.repository }}:{{ .Values.container.image.tag }}"
          imagePullPolicy: {{ .Values.container.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              httpd -f -p {{ .Values.container.port }} -h {{ .Values.container.workDir }}
          ports:
            - name: http
              containerPort: {{ .Values.container.port }}

          env:
            - name: PLAYER_INITIAL_LIVES
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap.name }}
                  key: player_initial_lives

          volumeMounts:
            - name: homework-volume
              mountPath: {{ .Values.container.workDir }}
            - name: config
              mountPath: {{ .Values.container.workDir }}/conf
              readOnly: true

          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.container.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}

          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.container.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - rm -f {{ .Values.container.workDir }}/index.html

      volumes:
        - name: homework-volume
          persistentVolumeClaim:
            claimName: {{ include "helm-hw.pvcName" . }}
        - name: config
          configMap:
            name: {{ .Values.configMap.name }}
