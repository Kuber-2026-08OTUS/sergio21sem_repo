apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "helm-hw.pvcName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helm-hw.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.pvc.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.pvc.storage }}
