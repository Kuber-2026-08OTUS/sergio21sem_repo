apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm-hw.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "helm-hw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "helm-hw.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.container.port }}
