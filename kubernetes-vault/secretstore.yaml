# SecretStore — подключение External Secrets Operator к HashiCorp Vault
# через Kubernetes auth (роль otus, ServiceAccount vault-auth).
# Применение: kubectl apply -f secretstore.yaml

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: vault
spec:
  provider:
    vault:
      # Endpoint Vault (TLS внутри кластера отключён)
      server: "http://vault.vault.svc:8200"
      # Путь монтирования KV-движка, созданного в Vault (шаг 5)
      path: "otus"
      # Версия KV-движка: secrets enable -path=otus kv создаёт KV версии 1
      version: "v1"
      auth:
        kubernetes:
          # Mount path метода аутентификации, включённого в шаге 7
          mountPath: "kubernetes"
          # Роль, созданная в шаге 9 (bound to vault-auth/vault, otus-policy)
          role: "otus"
          # ServiceAccount, чей JWT используется при логине в Vault
          serviceAccountRef:
            name: vault-auth
            namespace: vault
