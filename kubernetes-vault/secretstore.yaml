# SecretStore — подключение External Secrets Operator к HashiCorp Vault

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: vault
spec:
  provider:
    vault:
      # Endpoint Vault (TLS внутри кластера отключён)
      server: "http://vault.vault.svc:8200"
      path: "otus"
      version: "v1"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "otus"
          serviceAccountRef:
            name: vault-auth
            namespace: vault
