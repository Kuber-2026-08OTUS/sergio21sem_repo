# hashicorp/consul (https://github.com/hashicorp/consul-k8s)
# helm install consul hashicorp/consul -n consul --create-namespace -f consul-values.yaml

global:
  name: consul
  datacenter: dc1
  gossipEncryption:
    autoGenerate: true

dns:
  enabled: false
connectInject:
  enabled: false
syncCatalog:
  enabled: false

server:
  replicas: 3
  bootstrapExpect: 3
