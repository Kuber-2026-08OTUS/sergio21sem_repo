# ExternalSecret
# kubectl apply -f externalsecret.yaml

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otus-cred
  namespace: vault
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: otus-cred
  # KV-секрета /otus/cred на ключи Secret:
  #   otus/cred:username -> otus-cred:username
  #   otus/cred:password -> otus-cred:password
  data:
    - secretKey: username
      remoteRef:
        key: cred
        property: username
    - secretKey: password
      remoteRef:
        key: cred
        property: password
