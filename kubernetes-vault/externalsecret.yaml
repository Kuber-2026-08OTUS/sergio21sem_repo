# ExternalSecret — синхронизация секрета Vault otus/cred в Kubernetes Secret otus-cred.
# Применение: kubectl apply -f externalsecret.yaml

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: otus-cred
  namespace: vault
spec:
  # Как часто пересинхронизировать секрет
  refreshInterval: "1h"
  # Ссылка на SecretStore из шага 11
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  # Имя создаваемого Kubernetes Secret
  target:
    name: otus-cred
  # Маппинг полей KV-секрета /otus/cred на ключи Secret:
  #   otus/cred:username -> otus-cred:username
  #   otus/cred:password -> otus-cred:password
  data:
    - secretKey: username
      remoteRef:
        key: cred
        property: username
    - secretKey: password
      remoteRef:
        key: cred
        property: password
