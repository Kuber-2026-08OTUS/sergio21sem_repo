#https://kubernetes.io/docs/reference/access-authn-authz/rbac/
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cd
  namespace: homework
---
apiVersion: rbac.authorization.k8s.io/v1
# This role binding grants SA "cd" the built-in ClusterRole "admin"
# within the "homework" namespace.
kind: RoleBinding
metadata:
  name: cd-admin
  namespace: homework
subjects:
- kind: ServiceAccount
  name: cd
  namespace: homework
roleRef:
  # "roleRef" specifies the binding to a Role / ClusterRole
  kind: ClusterRole # "admin" is a built-in ClusterRole
  name: admin # this must match the name of the Role or ClusterRole you wish to bind to
  apiGroup: rbac.authorization.k8s.io