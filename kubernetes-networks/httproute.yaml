---
#https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/gateway-api/
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami-http
  namespace: homework
spec:
  parentRefs:
    - name: traefik
      sectionName: http
      kind: Gateway

  hostnames:
    - homework.otus

  rules:
     - matches:
        - path:
            type: PathPrefix
            value: /
       backendRefs:
        - name: whoami
          namespace: homework
          port: 80
